<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#D5CDBB">
<title>$GODOT_PROJECT_NAME</title>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #D5CDBB; color: #51483F; font: 14px system-ui, sans-serif; }
body { -webkit-user-select: none; user-select: none; overscroll-behavior: none; }
:root { --safe-top: max(4px, env(safe-area-inset-top)); --safe-right: max(4px, env(safe-area-inset-right)); --safe-bottom: max(4px, env(safe-area-inset-bottom)); --safe-left: max(4px, env(safe-area-inset-left)); }
#layout, #status { position: fixed; left: var(--game-left, 0px); top: var(--game-top, 0px); width: var(--game-width, 100%); height: var(--game-height, 100%); }
#layout { padding: var(--safe-top) var(--safe-right) var(--safe-bottom) var(--safe-left); display: flex; align-items: center; justify-content: center; gap: 6px; }
#screen { flex: 1; min-width: 0; height: 100%; display: flex; align-items: center; justify-content: center; }
#canvas { display: block; width: 640px; height: 360px; image-rendering: pixelated; image-rendering: crisp-edges; touch-action: none; outline: none; }
/* Godot 4.3 creates these keyboard/IME proxies dynamically. CSS applies before
   focus(), independently of the game's logical font size or canvas CSS scale. */
#screen input, #screen textarea, #screen [contenteditable="true"] { font-size: 16px !important; }
/* Godot supplies viewport-relative canvas rects; #layout is now positioned. */
#screen input, #screen textarea { position: fixed !important; }
.rail { display: none; flex: 0 0 82px; align-items: center; justify-content: center; gap: 6px; }
.touch .rail { display: flex; }
.frontend .rail { display: none; }
.touch.frontend #rotate { display: none; }
@media (orientation: portrait) { .touch.frontend #screen { height: 100%; flex: 1; } }
#actions { flex-direction: column; }
#dpad { display: grid; grid-template-columns: repeat(2, 36px); gap: 4px; }
#dpad [data-code="ArrowUp"], #dpad [data-code="ArrowDown"] { grid-column: 1 / 3; justify-self: center; }
button { border: 2px solid #80604B; border-radius: 2px; background: #BCC5AC; color: #51483F; font: bold 13px system-ui; min-width: 36px; min-height: 38px; padding: 4px; touch-action: none; -webkit-touch-callout: none; }
button.held, button:active { background: #A8B4B1; }
#actions button { width: 80px; min-height: 42px; background: #E9DFC8; }
#actions [data-code="KeyE"] { min-height: 58px; background: #C9AE92; }
#actions small { font-size: 11px; line-height: 1.1; display: block; }
button:disabled { opacity: .45; }
button:focus-visible { outline: 2px solid #80604B; outline-offset: 2px; }
#status { background: #D5CDBB; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px; text-align: center; z-index: 2; }
#status[hidden] { display: none; }
#start { min-width: 180px; }
#notice { max-width: 520px; white-space: pre-line; }
#rotate { position: absolute; bottom: var(--safe-bottom); left: 0; right: 0; text-align: center; font-size: 12px; pointer-events: none; display: none; }
@media (orientation: portrait) { .touch #layout { flex-wrap: wrap; align-content: center; } .touch #screen { flex: 0 0 100%; height: 56vw; order: -1; } .touch .rail { flex: 1; } .touch #actions { flex-direction: row; flex-wrap: wrap; } .touch #actions button { width: 80px; } .touch #rotate { display: block; } }
</style>
$GODOT_HEAD_INCLUDE
</head>
<body>
<main id="layout">
  <nav id="movement" class="rail" aria-label="Передвижение"><div id="dpad">
    <button data-code="ArrowUp" aria-label="Вверх">▲</button>
    <button data-code="ArrowLeft" aria-label="Влево">←</button>
    <button data-code="ArrowRight" aria-label="Вправо">→</button>
    <button data-code="ArrowDown" aria-label="Вниз">▼</button>
  </div></nav>
  <div id="screen"><canvas id="canvas" width="640" height="360" tabindex="0" aria-label="Little Village Shop">Для игры нужен браузер с WebGL 2.</canvas></div>
  <nav id="actions" class="rail" aria-label="Действия">
    <button data-code="KeyE" aria-label="Взаимодействовать"><span>✦</span><small id="action-label">Подойдите к предмету</small></button>
    <button data-code="KeyI" aria-label="Рюкзак">I<small>Рюкзак</small></button>
    <button data-code="Escape" aria-label="Меню">☰<small>Меню</small></button>
  </nav>
<div id="rotate">Поверните iPhone горизонтально — так удобнее играть.</div>
</main>
<section id="status" role="status">
  <strong>Лавка в маленькой деревне</strong>
  <div id="notice">Поверните телефон горизонтально.
Сохранения хранятся в этом браузере. Играйте в обычной вкладке Safari; очистка данных сайта удалит прогресс.</div>
  <progress id="progress" hidden></progress>
  <button id="start">Играть</button>
</section>
<noscript>Включите JavaScript, чтобы играть.</noscript>
<script>
'use strict';
const config = $GODOT_CONFIG;
let engine;
const canvas = document.getElementById('canvas');
const status = document.getElementById('status');
const notice = document.getElementById('notice');
const progress = document.getElementById('progress');
const start = document.getElementById('start');
start.disabled = true;
// The release guard runs before any engine resources are requested. Raw local
// exports can still run without the packaging step.
(async () => {
  if (!await (window.villageReleaseReady || Promise.resolve(true))) return;
  await new Promise((resolve, reject) => {
    const script = document.createElement('script');
    script.src = '$GODOT_URL';
    script.onload = resolve;
    script.onerror = () => reject(new Error('Не удалось загрузить движок игры'));
    document.head.appendChild(script);
  });
  engine = new Engine(config);
  start.disabled = false;
})().catch(error => {
  notice.textContent = `Игра не загрузилась. Проверьте соединение и перезагрузите страницу.\n${error.message || error}`;
});
const controls = [...document.querySelectorAll('[data-code]')];
const touch = navigator.maxTouchPoints > 0 || matchMedia('(pointer: coarse)').matches;
document.body.classList.toggle('touch', touch);
let ready = false;
let shopAction = '';
window.setShopAction = action => {
  shopAction = action;
  const button = document.querySelector('[data-code="KeyE"]');
  document.getElementById('action-label').textContent = action || 'Подойдите к предмету';
  button.setAttribute('aria-label', action || 'Подойдите к предмету');
  button.disabled = !ready || !action;
};
controls.forEach(button => { button.disabled = true; });
let frontend = true;
document.body.classList.add("frontend");
window.setFrontend = active => { frontend = active; releaseAll(); document.body.classList.toggle("frontend", active); resize(); };
// A keyboard changes the visual viewport, not the phone's orientation.
// Both the shell and Godot use this same choice of logical canvas dimensions.
window.isGamePortrait = () => {
  if (touch) {
    const type = window.screen.orientation?.type;
    if (type) return type.startsWith('portrait');
    if (typeof window.orientation === 'number') return Math.abs(window.orientation) % 180 === 0;
  }
  return matchMedia('(orientation: portrait)').matches;
};
function updateVisibleArea() {
  const view = window.visualViewport;
  // Do not counteract a deliberate pinch zoom by shrinking/recentring the game.
  // Use layout bounds while zoomed, so rotation still works without counter-zoom.
  // Input fonts prevent iOS focus zoom; no viewport-meta/scale reset is needed.
  const useVisual = view && Math.abs(view.scale - 1) <= 0.01;
  const root = document.documentElement;
  const values = {
    left: useVisual ? view.offsetLeft : 0,
    top: useVisual ? view.offsetTop : 0,
    width: useVisual ? view.width : root.clientWidth,
    height: useVisual ? view.height : Math.min(root.clientHeight, window.innerHeight)
  };
  for (const [key, value] of Object.entries(values)) {
    const pixels = `${Math.max(key === 'width' || key === 'height' ? 1 : 0, value)}px`;
    if (root.style.getPropertyValue(`--game-${key}`) !== pixels) root.style.setProperty(`--game-${key}`, pixels);
  }
}
function resize() {
  updateVisibleArea();
  const box = document.getElementById('screen').getBoundingClientRect();
  const portrait = frontend && window.isGamePortrait();
  const width = portrait ? 400 : 640;
  const height = portrait ? 740 : 360;
  // Policy 0 leaves the backing buffer to this shell. Godot detects the change
  // and rebuilds its viewport; CSS-only resizing would stretch a landscape buffer.
  if (canvas.width !== width) canvas.width = width;
  if (canvas.height !== height) canvas.height = height;
  const fit = Math.min(box.width / width, box.height / height);
  // Integer physical-pixel scaling when space permits. Downscale with nearest on small screens.
  const dpr = window.devicePixelRatio || 1;
  const integerScale = Math.floor(fit * dpr) / dpr;
  const scale = integerScale >= fit * 0.9 ? integerScale : fit;
  canvas.style.width = `${width * scale}px`;
  canvas.style.height = `${height * scale}px`;
  // Keep the active virtual-keyboard proxy aligned after Safari pans/shrinks
  // its visual viewport. Do not focus/blur it or alter its value/selection.
  const rect = canvas.getBoundingClientRect();
  for (const field of document.querySelectorAll('#screen input, #screen textarea')) {
    if (field.style.display === 'none') continue;
    Object.assign(field.style, {left: `${rect.left}px`, top: `${rect.top}px`, width: `${rect.width}px`, height: `${rect.height}px`});
  }
}
window.resizeGame = resize;
let resizeFrame = 0;
function queueResize() {
  if (!resizeFrame) resizeFrame = requestAnimationFrame(() => { resizeFrame = 0; resize(); });
}
let settleTimer;
function settleViewport() {
  queueResize();
  clearTimeout(settleTimer);
  // Safari may finish dismissing its keyboard after focusout has already fired.
  settleTimer = setTimeout(queueResize, 350);
}
new ResizeObserver(queueResize).observe(document.getElementById('screen'));
window.addEventListener('orientationchange', () => { releaseAll(); settleViewport(); });
window.screen.orientation?.addEventListener?.('change', settleViewport);
window.addEventListener('resize', queueResize);
window.addEventListener('pageshow', settleViewport);
window.visualViewport?.addEventListener('resize', queueResize);
window.visualViewport?.addEventListener('scroll', queueResize);
for (const type of ['focusin', 'focusout']) document.addEventListener(type, event => {
  if (event.target.matches('input, textarea, [contenteditable="true"]')) settleViewport();
});
const keys = {ArrowUp: ['ArrowUp', 38], ArrowDown: ['ArrowDown', 40], ArrowLeft: ['ArrowLeft', 37], ArrowRight: ['ArrowRight', 39], KeyE: ['e', 69], KeyI: ['i', 73], Escape: ['Escape', 27]};
const pointers = new Map();
function sendKey(code, pressed) {
  const [key, keyCode] = keys[code];
  canvas.dispatchEvent(new KeyboardEvent(pressed ? 'keydown' : 'keyup', {code, key, keyCode, which: keyCode, bubbles: true, cancelable: true}));
}
function releasePointer(id) {
  const button = pointers.get(id);
  if (!button) return;
  pointers.delete(id);
  if (![...pointers.values()].includes(button)) {
    sendKey(button.dataset.code, false);
    button.classList.remove('held');
  }
}
function releaseAll() { for (const id of [...pointers.keys()]) releasePointer(id); }
for (const button of controls) {
  button.addEventListener('pointerdown', event => {
    event.preventDefault();
    if (!ready) return;
    canvas.focus({preventScroll: true});
    button.setPointerCapture(event.pointerId);
    const alreadyHeld = [...pointers.values()].includes(button);
    pointers.set(event.pointerId, button);
    button.classList.add('held');
    if (!alreadyHeld) sendKey(button.dataset.code, true);
  });
  for (const type of ['pointerup', 'pointercancel', 'lostpointercapture']) button.addEventListener(type, event => { event.preventDefault(); releasePointer(event.pointerId); });
  button.addEventListener('contextmenu', event => event.preventDefault());
}
window.addEventListener('blur', releaseAll);
window.addEventListener('pagehide', releaseAll);
document.addEventListener('visibilitychange', () => { if (document.hidden) releaseAll(); });
// Keep page scrolling and browser shortcuts from taking the game's arrow/Esc input.
canvas.addEventListener('keydown', event => { if (keys[event.code]) event.preventDefault(); });
canvas.addEventListener('contextmenu', event => event.preventDefault());
start.addEventListener('click', async () => {
  start.disabled = true;
  const missing = Engine.getMissingFeatures({threads: $GODOT_THREADS_ENABLED});
  if (missing.length) { notice.textContent = `Не удалось запустить игру. Нужны: ${missing.join(', ')}. Обновите iOS/Safari.`; return; }
  // A multisampled presentation buffer avoids WebKit's default-framebuffer alias
  // during Emscripten swaps. The game's fixed 640x360 viewport uses no MSAA,
  // nearest textures and nearest CSS scaling; sprite pixels remain sharp.
  canvas.getContext('webgl2', {alpha: false, antialias: true, depth: true, stencil: true, preserveDrawingBuffer: true});
  progress.hidden = false;
  notice.textContent = 'Загружаем магазин…';
  try {
    await engine.startGame({canvas, onProgress: (current, total) => { if (total > 0) { progress.max = total; progress.value = current; } }});
    ready = true;
    controls.forEach(button => { button.disabled = false; });
    window.setShopAction(shopAction);
    status.hidden = true;
    resize();
    canvas.focus({preventScroll: true});
    document.body.dataset.gameReady = 'true';
  } catch (error) {
    console.error(error);
    notice.textContent = `Игра не загрузилась. Проверьте соединение и перезагрузите страницу.\n${error.message || error}`;
    progress.hidden = true;
  }
});
resize();
</script>
</body>
</html>
